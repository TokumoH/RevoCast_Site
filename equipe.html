<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipe · Revocast</title>
  <meta name="description" content="Conheça a equipe do Revocast.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%23B8FF3C%22/><text y=%22.72em%22 x=%22.2em%22 font-size=%2272%22>🎙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/equipe.css">
</head>
<body>

  <!-- ===== HEADER =====
       Se o seu site já tem header, copie só o <li> "Equipe" (marcado abaixo)
       para o menu das outras páginas. -->
  <header class="site-header">
    <div class="wrap header-in">
      <a href="index.html" class="brand" aria-label="Revocast — início">
        <img src="assets/img/logo.svg" alt="Revocast" height="34">
      </a>
      <button class="menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav" class="nav" aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="episodios.html">Episódios</a></li>
          <li><a href="equipe.html" aria-current="page">Equipe</a></li><!-- ← link novo -->
          <li><a href="contato.html" class="nav-cta">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== HERO: foto da equipe toda + logo ===== -->
    <section class="hero" id="hero" aria-label="Equipe Revocast">
      <img class="hero-bg" id="hero-foto" alt="Toda a equipe do Revocast reunida" fetchpriority="high">
      <div class="hero-shade"></div>
      <div class="hero-content wrap">
        <img class="hero-logo" id="hero-logo" alt="Revocast">
        <h1 id="hero-titulo"></h1>
        <p id="hero-sub"></p>
        <a href="#time" class="scroll-hint">Conheça o time <span aria-hidden="true">↓</span></a>
      </div>
      <div class="sticker s1" aria-hidden="true">🎙</div>
      <div class="sticker s2" aria-hidden="true">✦</div>
    </section>

    <!-- faixa em movimento -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker"></div>
    </div>

    <!-- ===== MEMBROS ===== -->
    <section class="team wrap" id="time">
      <header class="team-head">
        <p class="eyebrow">Equipe</p>
        <h2 id="secao-titulo"></h2>
        <p id="secao-sub"></p>
      </header>
      <ul class="grid" id="grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap foot-in">
      <img src="assets/img/logo.svg" alt="Revocast" height="28">
      <p>© <span id="ano"></span> Revocast · Feito pela galera 💚</p>
    </div>
  </footer>

  <script src="assets/js/equipe-data.js"></script>
  <script src="assets/js/equipe.js"></script>
</body>
</html>
